<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#121316">
<title>训迹 · 动作库 H5</title>
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
<div class="app">

  <!-- ================= 列表页 ================= -->
  <section id="listPage" class="list-page">
    <div class="search-row">
      <div class="search">
        <span class="search-icon"></span>
        <input id="searchInput" type="search" placeholder="输入动作名字搜索" autocomplete="off" spellcheck="false">
      </div>
      <button class="plus" id="plusBtn" aria-label="添加动作"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>

    <div class="content-row">
      <aside class="side-nav" id="sideNav"></aside>
      <main class="grid-area">
        <h2 class="section-title" id="sectionTitle">胸部</h2>
        <div class="load-tip hidden" id="loadTip"><div class="plate-spinner"></div><span>正在装配 1,324 个动作…</span></div>
        <div id="grid"></div>
        <div class="empty hidden" id="empty">
          <div class="empty-icon"><svg viewBox="0 0 24 24" width="36" height="36"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5l-4.6-4.6"/></svg></div>
          <div>没有找到相关动作</div>
        </div>
      </main>
    </div>

    <nav class="bottom-nav">
      <div class="nav-item" data-page="train"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg></span><div>训练</div></div>
      <div class="nav-item" data-page="challenge"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v6a5 5 0 0 1-10 0V4z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg></span><div>挑战</div></div>
      <div class="nav-item active" data-page="list"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg></span><div>动作</div></div>
      <div class="nav-item" data-page="history"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.2 2"/></svg></span><div>历史</div></div>
      <div class="nav-item" data-page="mine"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c.5-4 3.5-6 7.5-6s7 2 7.5 6"/></svg></span><div>我的</div></div>
      <button class="train" id="trainFloatBtn">训练</button>
    </nav>
  </section>

  <!-- ================= 详情页 ================= -->
  <section id="detailPage" class="detail-page hidden">
    <button class="detail-back" onclick="App.closeDetail()">‹</button>

    <div class="detail-top">
      <span class="lock" id="dLock">🔓</span>
      <div class="detail-name" id="dName">动作名称</div>
      <div class="top-tools">
        <div class="tool active"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 6.5"/></svg></span><span>要点</span></div>
        <div class="tool"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.2 2"/></svg></span><span>历史</span></div>
        <div class="tool"><span class="ico"><svg viewBox="0 0 24 24"><path d="M5 20v-6M12 20V4M19 20v-9"/></svg></span><span>图表</span></div>
        <div class="tool"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 17v4M8.5 4h7L14.5 12h-5L8.5 4z"/></svg></span><span>置顶</span></div>
      </div>
    </div>

    <div id="detailBody"><!-- JS 渲染 --></div>

    <button class="close-btn" onclick="App.closeDetail()">关闭</button>
  </section>

  <!-- ================= 占位页：训练 ================= -->
  <section id="trainPage" class="placeholder-page hidden">
    <div class="ph-page-card">
      <div class="ph-page-icon"><svg viewBox="0 0 24 24" width="44" height="44"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg></div>
      <h2>训练计划</h2>
      <p>在这里规划你的专属训练计划，安排动作与组次。</p>
      <button class="ph-btn" onclick="App.switchNav('list')">去选动作 ›</button>
    </div>
  </section>

  <!-- ================= 占位页：挑战 ================= -->
  <section id="challengePage" class="placeholder-page hidden">
    <div class="ph-page-card">
      <div class="ph-page-icon"><svg viewBox="0 0 24 24" width="44" height="44"><path d="M8 21h8M12 17v4M7 4h10v6a5 5 0 0 1-10 0V4z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg></div>
      <h2>挑战</h2>
      <p>连续打卡、重量挑战与朋友对战，坚持就有收获。</p>
      <button class="ph-btn" onclick="App.switchNav('list')">去看看 ›</button>
    </div>
  </section>

  <!-- ================= 占位页：历史 ================= -->
  <section id="historyPage" class="placeholder-page hidden">
    <div class="ph-page-card">
      <div class="ph-page-icon"><svg viewBox="0 0 24 24" width="44" height="44"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.2 2"/></svg></div>
      <h2>训练历史</h2>
      <p>你的每一次训练记录都会沉淀在这里。</p>
      <button class="ph-btn" onclick="App.switchNav('list')">开始训练 ›</button>
    </div>
  </section>

  <!-- ================= 占位页：我的 ================= -->
  <section id="minePage" class="placeholder-page hidden">
    <div class="ph-page-card">
      <div class="ph-page-icon"><svg viewBox="0 0 24 24" width="44" height="44"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c.5-4 3.5-6 7.5-6s7 2 7.5 6"/></svg></div>
      <h2>我的</h2>
      <p>个人资料、训练偏好与数据统计都在这里。</p>
      <button class="ph-btn" onclick="App.switchNav('list')">返回动作库 ›</button>
    </div>
  </section>

</div>

<script src="js/classification.js"></script>
<script src="js/app.js"></script>
</body>
</html>
